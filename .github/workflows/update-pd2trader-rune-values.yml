name: Update PD2 Trader Economy Values

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-pd2trader-rune-values-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-rune-values:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update economy values from PD2 Trader
        run: node scripts/update-pd2trader-runes.mjs
        env:
          PD2TRADER_LADDER: 'true'
          PD2TRADER_HARDCORE: 'false'

      - name: Check if alias file changed
        id: check
        run: |
          if git diff --quiet -- "builderfilter/02-alias/04-alias-economy-values[ALL].filter"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Increment version
        if: steps.check.outputs.changed == 'true'
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          if ! echo "$VERSION" | grep -qE '^[0-9]+$'; then VERSION=0; fi
          VERSION=$((VERSION + 1))
          echo "$VERSION" > version.txt
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build filters
        if: steps.check.outputs.changed == 'true'
        run: python builderfilter/build.py

      - name: Generate README
        if: steps.check.outputs.changed == 'true'
        run: python builderreadme/create_readme.py

      - name: Validate filters
        if: steps.check.outputs.changed == 'true'
        run: python validate_filters.py --errors-only

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_BRANCH: bot/update-rune-values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "builderfilter/02-alias/04-alias-economy-values[ALL].filter" \
                  version.txt \
                  "builderfilter/01-header/01-Version[ALL].filter" \
                  filter_definitions.json \
                  README.md
          git add *.filter 2>/dev/null || true
          git add filtergroups 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update PD2 Trader economy values (version ${{ env.VERSION }})"

          git push --force origin "HEAD:$BOT_BRANCH"
          existing_pr=$(gh pr list --head "$BOT_BRANCH" --base main --state open --json number -q '.[0].number')
          if [ -z "$existing_pr" ]; then
            gh pr create \
              --base main \
              --head "$BOT_BRANCH" \
              --title "Update PD2 Trader economy values (version ${{ env.VERSION }})" \
              --body "Automated economy refresh from PD2 Trader (runes + uber mats + PD2 items). Version bumped to ${{ env.VERSION }}."
          else
            echo "Existing PR #$existing_pr was updated by force-push."
          fi
